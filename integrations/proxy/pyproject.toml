[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragfaith-proxy"
version = "0.1.6"
description = "Universal OpenAI-compatible sidecar proxy with a live ragfaith faithfulness cascade"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
spacy = ["spacy>=3.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ragfaith-proxy = "ragfaith_proxy.proxy:main"

[project.urls]
Homepage = "https://github.com/resonanceee/ragfaith/tree/main/integrations/proxy"
Repository = "https://github.com/resonanceee/ragfaith"
Issues = "https://github.com/resonanceee/ragfaith/issues"

[tool.setuptools.packages.find]
include = ["ragfaith_proxy*"]
